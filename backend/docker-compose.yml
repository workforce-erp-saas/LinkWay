services:
  linkway-sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: linkway-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD}"
    ports:
      - "1433:1433"
    volumes:
      - linkway_sql_data:/var/opt/mssql
    restart: unless-stopped

volumes:
  linkway_sql_data:
